<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface2:#E3E9EE; --ink:#1B2733; --ink2:#5A6B7B; --line:#D3DCE3;
  --accent:#24456B; --on-accent:#FFFFFF; --danger:#B3261E;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121A22;--surface:#1A242E;--surface2:#24303C;--ink:#E4EAF0;--ink2:#9AAAB8;--line:#2E3B48;--danger:#F2B8B5}
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface2)}

/* App shell */
#app{height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;position:relative}
.topbar{display:flex;align-items:center;gap:4px;padding:6px 6px;min-height:56px}
.topbar .title{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.avatar.lg{width:64px;height:64px;font-size:26px}

/* Messages */
#scroller{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 16px}
.msg{margin:14px 0;max-width:100%}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--surface2);padding:10px 14px;border-radius:20px 20px 6px 20px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.bubble img{display:block;max-width:100%;max-height:240px;border-radius:12px;margin-bottom:8px}
.msg.assistant .body{font-family:var(--read);font-size:17px;line-height:1.65;word-wrap:break-word}
.body p{margin:0 0 .8em}
.body h1,.body h2,.body h3{font-family:var(--ui);line-height:1.3;margin:1.1em 0 .4em}
.body h1{font-size:1.3em}.body h2{font-size:1.15em}.body h3{font-size:1.05em}
.body ul,.body ol{padding-left:1.4em;margin:0 0 .8em}
.body li{margin:.2em 0}
.body a{color:var(--accent)}
.body code{font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--surface2);padding:1px 5px;border-radius:5px}
.body pre{background:var(--surface2);padding:12px;border-radius:12px;overflow-x:auto}
.body pre code{background:none;padding:0}
.body table{border-collapse:collapse;display:block;overflow-x:auto;margin:0 0 .8em;font-family:var(--ui);font-size:15px}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.body blockquote{margin:0 0 .8em;padding-left:12px;border-left:3px solid var(--line);color:var(--ink2)}
.msg-actions{display:flex;gap:4px;margin-top:2px;color:var(--ink2);font-size:13px;align-items:center}
.msg-actions button{padding:6px 8px;border-radius:8px;color:var(--ink2)}
.msg-actions button:hover{background:var(--surface2)}
.err{color:var(--danger);font-family:var(--ui);font-size:15px;background:color-mix(in srgb,var(--danger) 10%,transparent);padding:10px 12px;border-radius:12px}
.typing{display:inline-flex;gap:5px;padding:8px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.7}}

/* Empty state */
.empty{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 8px 10vh}
.empty h1{font-family:var(--read);font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.2;margin:0 0 20px}
.empty h1 span{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-size:15px;text-align:left}
.chip:hover{border-color:var(--accent)}

/* Composer */
.composer{padding:8px 12px 12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 6px}
.previews{display:flex;gap:8px;padding:6px 8px 0;flex-wrap:wrap}
.previews div{position:relative}
.previews img{width:56px;height:56px;object-fit:cover;border-radius:10px;display:block}
.previews button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:14px;line-height:1}
#input{width:100%;border:0;background:none;resize:none;outline:none;padding:8px 12px;max-height:180px;font-size:16px;display:block}
.row{display:flex;align-items:center;gap:4px}
.row .spacer{flex:1}
.modelchip{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;font-size:14px;color:var(--ink2)}
.modelchip:hover{background:var(--surface2)}
.modelchip select{border:0;background:none;outline:none;font-size:14px;color:var(--ink2);max-width:150px;cursor:pointer}
#send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
#send:disabled{opacity:.35;cursor:default}
#send .icon{width:20px;height:20px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--surface);z-index:11;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-radius:0 20px 20px 0}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer-head{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.drawer-head .who{flex:1;min-width:0}
.drawer-head .who b{display:block}
.drawer-head .who button{color:var(--accent);font-size:14px;padding:0}
.newchat{margin:12px 12px 4px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-weight:600}
.chatlist{flex:1;overflow-y:auto;padding:4px 8px}
.chatlist h3{font-size:13px;font-weight:600;color:var(--ink2);margin:14px 8px 4px}
.chatitem{display:flex;align-items:center;border-radius:12px}
.chatitem.active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chatitem .open{flex:1;min-width:0;text-align:left;padding:10px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem .del{width:36px;height:36px;color:var(--ink2);border-radius:50%;display:grid;place-items:center;opacity:.6}
.chatitem .del:hover{opacity:1;background:var(--surface2)}
.chatitem .del .icon{width:18px;height:18px}
.drawer-foot{border-top:1px solid var(--line);padding:6px 8px}
.drawer-foot button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border-radius:12px;text-align:left}
.drawer-foot button:hover,.chatitem:hover{background:var(--surface2)}

/* Full screens */
.screen{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen .inner{max-width:640px;margin:0 auto;padding:0 16px 40px}
.screen .topbar{position:sticky;top:0;background:var(--bg);z-index:1;margin:0 -10px}
.card{background:var(--surface);border-radius:20px;padding:16px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 4px}
.card p.hint{color:var(--ink2);font-size:14px;margin:0 0 12px}

<script>
"use strict";
/* ---------- Storage: IndexedDB -> localStorage -> Arbeitsspeicher ---------- */
let STORAGE_MODE = "idb";
const DB = (() => {
  const mem = {};
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
  // IndexedDB backend
  let dbp;
  const idbOpen = () => dbp || (dbp = withTimeout(new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("no idb"));
    const r = indexedDB.open("stube", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error("blocked"));
  }), 2500));
  const idbTx = async (mode, fn) => {
    const db = await idbOpen();
    return withTimeout(new Promise((res, rej) => {
      const t = db.transaction("kv", mode); const req = fn(t.objectStore("kv"));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }), 4000);
  };
  const idb = {
    get: k => idbTx("readonly", s => s.get(k)),
    set: (k, v) => idbTx("readwrite", s => s.put(v, k)),
    del: k => idbTx("readwrite", s => s.delete(k)),
    clear: () => idbTx("readwrite", s => s.clear()),
  };
  // localStorage backend
  const LS = "stube:";
  const ls = {
    get: async k => { const v = localStorage.getItem(LS + k); return v == null ? undefined : JSON.parse(v); },
    set: async (k, v) => { localStorage.setItem(LS + k, JSON.stringify(v)); },
    del: async k => { localStorage.removeItem(LS + k); },
    clear: async () => { Object.keys(localStorage).filter(x => x.startsWith(LS)).forEach(x => localStorage.removeItem(x)); },
  };
  // memory backend (last resort, nothing persists)
  const memB = {
    get: async k => mem[k], set: async (k, v) => { mem[k] = v; }, del: async k => { delete mem[k]; }, clear: async () => { for (const k in mem) delete mem[k]; },
  };
  let backend = null;
  const pick = async () => {
    if (backend) return backend;
    try { await idb.set("__test", 1); await idb.get("__test"); backend = idb; STORAGE_MODE = "idb"; return backend; } catch (e) { console.warn("IndexedDB nicht nutzbar:", e); }
    try { localStorage.setItem(LS + "__test", "1"); localStorage.removeItem(LS + "__test"); backend = ls; STORAGE_MODE = "ls"; return backend; } catch (e) { console.warn("localStorage nicht nutzbar:", e); }
    backend = memB; STORAGE_MODE = "mem"; return backend;
  };
  const call = async (op, ...a) => {
    const b = await pick();
    try { return await b[op](...a); }
    catch (e) {
      if (op === "get") return undefined;
      if (b === ls && e && e.name === "QuotaExceededError") throw new Error("Der Speicher ist voll. Lösche ein paar alte Chats, vor allem solche mit Bildern.");
      throw e;
    }
  };
  return { get: k => call("get", k), set: (k, v) => call("set", k, v), del: k => call("del", k), clear: () => call("clear"), init: pick };
})();

Format: eine eigene Zeile ~~~~artefakt:TYP:Titel, danach der vollständige Inhalt, danach eine eigene Zeile ~~~~ . Genau vier Tilden, kein zusätzlicher Codeblock darum.
Typen:
- html: ein vollständiges HTML-Dokument mit eingebettetem CSS und JavaScript. Externe Skripte nur von https://cdnjs.cloudflare.com.

Wenn die Person ein bestehendes Artefakt ändern möchte, gib es mit genau demselben Titel vollständig neu aus; dann entsteht automatisch eine neue Version. Schreibe außerhalb des Artefakts nur ein, zwei Sätze.

let me = null;       // active profile

/* ---------- Blöcke "~~~~datei:NAME" und "~~~~artefakt:TYP:Titel" erkennen ---------- */
const ART_TYPES = { html: "HTML", react: "React", svg: "SVG", mermaid: "Diagramm", markdown: "Dokument", md: "Dokument" };
function splitFiles(text) {
  // liefert abwechselnd Text-, Datei- und Artefakt-Teile
  const parts = []; let pos = 0;
  const OPEN = /(^|\n)[ \t]*~~~~[ \t]*(datei|artefakt):[ \t]*([^\n]+)\n/g;
  let m;
  while ((m = OPEN.exec(text))) {
    parts.push({ text: text.slice(pos, m.index) });
    const start = m.index + m[0].length;
    const closeRe = /\n[ \t]*~~~~[ \t]*(?=\n|$)/g; closeRe.lastIndex = start - 1;
    const c = closeRe.exec(text);
    const done = !!c;
    let content = done ? text.slice(start, c.index) : text.slice(start);
    if (m[2] === "datei") {
      parts.push({ file: { name: m[3].trim().replace(/[\\/:*?"<>|]/g, "_"), content, done } });
    } else {
      let head = m[3].trim(), type = "html", title = head;
      const i = head.indexOf(":");
      if (i > 0 && ART_TYPES[head.slice(0, i).trim().toLowerCase()]) { type = head.slice(0, i).trim().toLowerCase(); title = head.slice(i + 1).trim(); }
      if (type === "md") type = "markdown";
      // falls das Modell doch einen Codeblock darum legt
      content = content.replace(/^\s*```[a-zA-Z]*\s*\n/, "").replace(/\n```\s*$/, "");
      parts.push({ art: { type, title: title || "Artefakt", content, done } });
    }

    OPEN.lastIndex = pos;
  }
  parts.push({ text: text.slice(pos) });

}
function renderBody(el, text) {
  el.innerHTML = "";

    if (p.file) el.append(fileCard(p.file));
    else if (p.art) el.append(artCard(p.art));
    else if (p.text.trim()) { const d = document.createElement("div"); d.innerHTML = md(p.text); el.append(d); }

function md(text) {
  if (window.marked) {
    const html = marked.parse(text, { breaks: true, gfm: true });
    return window.DOMPurify ? DOMPurify.sanitize(html) : esc(text).replace(/\n/g, "<br>");

function migrate() {
  let ch = false;
  if (!S.providers) {
    S.providers = [{ id: "anthropic", preset: "anthropic", type: "anthropic", name: PRESETS.anthropic.name, baseUrl: PRESETS.anthropic.baseUrl, apiKey: S.apiKey || "" }];
    delete S.apiKey; ch = true;
  }
  S.models = (S.models || []).map(m => {
    if (m.key && m.provider) return m;
    ch = true; return Object.assign({ key: uid(), provider: "anthropic" }, m);
  });
  const byIdOrKey = v => S.models.find(m => m.key === v) || S.models.find(m => m.id === v);
  if (S.defaultModel && S.defaultModel !== "auto" && !S.models.find(m => m.key === S.defaultModel)) {
    const m = byIdOrKey(S.defaultModel); S.defaultModel = m ? m.key : ""; ch = true;
  }
  if (!S.router) {
    const ant = S.models.filter(m => m.provider === "anthropic");
    const haiku = ant.find(m => /haiku/i.test(m.id)) || ant[0] || S.models[0] || {};
    const sonnet = ant.find(m => /sonnet/i.test(m.id)) || haiku;
    S.router = { model: haiku.key || "", einfach: haiku.key || "", aktuell: haiku.key || "", komplex: sonnet.key || "" };
    ch = true;
  }
  if (S.webSearch === undefined) { S.webSearch = true; S.webMax = 3; S.searchPrice = 10; ch = true; }
  if (S.artifacts === undefined) { S.artifacts = true; ch = true; }
  for (const p of P) {
    if (p.model && !S.models.find(m => m.key === p.model)) { const m = byIdOrKey(p.model); p.model = m ? m.key : ""; ch = true; }
    if (p.external === undefined) { p.external = !p.kid; ch = true; }

}

/* ---------- Sprachausgabe ---------- */
function speakableText(t) {
  return splitFiles(t).map(p => p.file ? ` Ich habe die Datei ${p.file.name.replace(/\.[^.]+$/, "").replace(/[_-]/g, " ")} erstellt. ` : p.art ? ` Ich habe ${p.art.title} erstellt. ` : p.text).join("")
    .replace(/```[\s\S]*?```/g, " (Codeblock) ")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/^\s*\|?[\s:|-]+\|[\s:|-]*$/gm, "")
    .replace(/^[ \t]*\|[ \t]*|[ \t]*\|[ \t]*$/gm, "")
    .replace(/\s*\|\s*/g, ", ")
    .replace(/^#{1,6}\s*/gm, "").replace(/^\s*[-*+]\s+/gm, "").replace(/^\s*>\s?/gm, "")
    .replace(/[*_~]{1,3}([^*_~]+)[*_~]{1,3}/g, "$1")
    .replace(/https?:\/\/\S+/g, "Link")
    .replace(/\n{2,}/g, "\n").replace(/([^.!?:;,\s])[ \t]*\n/g, "$1. ").replace(/\n/g, " ").replace(/\.\s*\./g, ".").replace(/\s{2,}/g, " ").trim();
}
const TTS = {
  ok: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
  btn: null,
  voice() {
    const vs = speechSynthesis.getVoices().filter(v => /^de(-|_|$)/i.test(v.lang));
    return vs.find(v => /google/i.test(v.name)) || vs.find(v => v.localService) || vs[0] || null;
  },
  stop() { if (!this.ok) return; speechSynthesis.cancel(); if (this.btn) this.btn.textContent = "Vorlesen"; this.btn = null; },
  speak(text, btn) {
    if (!this.ok) return;
    this.stop();
    const clean = speakableText(text); if (!clean) return;
    // in Sätze aufteilen, weil Chrome lange Texte sonst nach ca. 15 s abbricht
    const parts = clean.match(/[^.!?]+[.!?]*\s*/g) || [clean];
    const chunks = []; let cur = "";
    for (const p of parts) { if ((cur + p).length > 220 && cur) { chunks.push(cur); cur = ""; } cur += p; }
    if (cur.trim()) chunks.push(cur);
    const voice = this.voice(); const rate = (S && S.ttsRate) || 1;
    this.btn = btn || null; if (btn) btn.textContent = "Stopp";
    chunks.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c.trim()); u.lang = "de-DE"; u.rate = rate; if (voice) u.voice = voice;
      if (i === chunks.length - 1) u.onend = () => { if (this.btn === btn) { if (btn) btn.textContent = "Vorlesen"; this.btn = null; } };
      u.onerror = () => { if (btn) btn.textContent = "Vorlesen"; };
      speechSynthesis.speak(u);
    });
  },
  toggle(text, btn) { if (this.btn === btn) this.stop(); else this.speak(text, btn); },
};
if (TTS.ok) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }

const STT = {

function shrinkImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1568; let { width: w, height: h } = img; const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);

      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);

// neutraler Verlauf: [{role, text, images}]
function apiMessages() {
  let msgs = cur.messages.filter(m => !m.error && (m.text || (m.images || []).length));
  msgs = msgs.slice(-Math.max(2, S.history || 30));
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  const out = [];
  for (const m of msgs) {
    const last = out[out.length - 1];
    if (last && last.role === m.role) { last.text = [last.text, m.text].filter(Boolean).join("\n\n"); last.images = last.images.concat(m.images || []); }
    else out.push({ role: m.role, text: m.text || "", images: (m.images || []).slice() });
  }
  if (out.length && out[out.length - 1].role === "assistant") out.pop();
  return out;
}
function friendlyError(e) {
  const status = e.status, body = e.body || "", pn = e.provider ? e.provider.name : "dem Anbieter";
  if (e.msg) return e.msg;
  let msg = "";
  try { let j = JSON.parse(body); if (Array.isArray(j)) j = j[0]; const er = j.error || j; msg = (typeof er === "string" ? er : er.message) || ""; } catch { msg = body.slice(0, 200); }
  if (status === 401 || status === 403 && /key|auth|permission/i.test(msg)) return `Der API-Schlüssel für ${pn} wurde abgelehnt. Prüfe ihn in den Einstellungen.`;
  if (status === 402 || /credit balance|insufficient|quota/i.test(msg)) return `Das Guthaben bei ${pn} ist aufgebraucht oder das Kontingent erreicht. (${msg})`;
  if (status === 429) return `${pn}: Zu viele Anfragen oder Gratis-Limit erreicht. Warte etwas oder wähle ein anderes Modell. (${msg})`;
  if (status === 529 || status === 503) return `${pn} ist gerade überlastet. Versuch es gleich noch einmal.`;
  if (/web.?search/i.test(msg)) return "Die Websuche ist nicht freigeschaltet. Aktiviere sie in der Claude Console unter Einstellungen → Privatsphäre, oder schalte sie in der App aus. (" + msg + ")";
  if (status === 404 || /model/i.test(msg)) return `Das Modell ist bei ${pn} nicht verfügbar. Prüfe die Modell-ID in den Einstellungen. (${msg})`;
  if (status === 0 && !msg) return "Keine Antwort vom Anbieter. Prüfe die Adresse in den Einstellungen.";
  return `Fehler ${status || ""} bei ${pn}: ${msg || "Unbekannter Fehler"}`;
}
function baseUrl(p) { return (p.baseUrl || PRESETS[p.preset || "custom"].baseUrl || "").replace(/\/+$/, ""); }
function anthHeaders(p) { return { "content-type": "application/json", "x-api-key": p.apiKey || "", "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }; }
function oaHeaders(p) { const h = { "content-type": "application/json" }; if (p.apiKey) h.Authorization = "Bearer " + p.apiKey; return h; }

async function readSSE(res, onEvent) {
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  const flush = chunk => {
    const data = chunk.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("");
    if (!data || data === "[DONE]") return;
    let ev; try { ev = JSON.parse(data); } catch { return; }
    onEvent(ev);
  };
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r/g, "");
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) { const chunk = buf.slice(0, i); buf = buf.slice(i + 2); flush(chunk); }
  }
  if (buf.trim()) flush(buf);
}

async function streamAnthropic(m, p, sys, msgs, web, signal, cb) {
  const body = {
    model: m.id, max_tokens: +S.maxTokens || 8192, system: sys, stream: true,
    messages: msgs.map(x => ({ role: x.role, content: [
      ...(x.images || []).map(i => ({ type: "image", source: { type: "base64", media_type: i.media_type, data: i.data } })),
      ...(x.text ? [{ type: "text", text: x.text }] : []),
    ] })),
  };
  if (web) body.tools = [{ type: "web_search_20250305", name: "web_search", max_uses: +S.webMax || 3 }];
  const res = await fetch(baseUrl(p) + "/v1/messages", { method: "POST", signal, headers: anthHeaders(p), body: JSON.stringify(body) });
  if (!res.ok) throw { status: res.status, body: await res.text(), provider: p };
  const r = { inTok: 0, outTok: 0, searches: 0, sources: [] };
  const kinds = {}; let toolJson = "";
  await readSSE(res, ev => {
    if (ev.type === "message_start") { const u = ev.message.usage || {}; r.inTok = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0); }
    else if (ev.type === "content_block_start") {
      const b = ev.content_block || {}; kinds[ev.index] = b.type;
      if (b.type === "server_tool_use") { toolJson = ""; cb.status("Sucht im Internet …"); }
      if (b.type === "web_search_tool_result" && Array.isArray(b.content)) {
        for (const x of b.content) if (x.url && !r.sources.some(s => s.url === x.url)) r.sources.push({ url: x.url, title: x.title || x.url });
        cb.status("Liest die Ergebnisse …");
      }
    }
    else if (ev.type === "content_block_delta") {
      const d = ev.delta || {};
      if (d.type === "text_delta") cb.text(d.text);
      else if (d.type === "input_json_delta") { toolJson += d.partial_json || ""; const q = toolJson.match(/"query"\s*:\s*"((?:[^"\\]|\\.)*)"/); if (q) cb.status(`Sucht: „${q[1].replace(/\\"/g, '"')}“`); }
    }
    else if (ev.type === "message_delta" && ev.usage) {
      const u = ev.usage;
      r.outTok = u.output_tokens || r.outTok;
      const inNow = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
      if (inNow > r.inTok) r.inTok = inNow;
      if (u.server_tool_use && u.server_tool_use.web_search_requests) r.searches = u.server_tool_use.web_search_requests;
    }
    else if (ev.type === "error") throw { status: 0, body: JSON.stringify(ev), provider: p };
  });
  return r;
}

async function streamOpenAI(m, p, sys, msgs, signal, cb) {
  const messages = [{ role: "system", content: sys }, ...msgs.map(x => ({
    role: x.role,
    content: x.role === "user" && (x.images || []).length
      ? [...(x.text ? [{ type: "text", text: x.text }] : []), ...x.images.map(i => ({ type: "image_url", image_url: { url: `data:${i.media_type};base64,${i.data}` } }))]
      : x.text,
  }))];
  const body = { model: m.id, messages, stream: true, stream_options: { include_usage: true } };
  if (p.preset === "openai") body.max_completion_tokens = +S.maxTokens || 8192;
  if (p.preset === "openrouter" && isFree(m)) {
    // Gratis-Modelle sind oft überlastet: OpenRouter darf auf andere Gratis-Modelle ausweichen
    const alts = S.models.filter(x => x.on && x.provider === p.id && isFree(x) && x.key !== m.key).map(x => x.id).slice(0, 2);
    if (alts.length) body.models = [m.id, ...alts];
  }
  const post = () => fetch(baseUrl(p) + "/chat/completions", { method: "POST", signal, headers: oaHeaders(p), body: JSON.stringify(body) });
  let res = await post();
  if (!res.ok) {
    const t = await res.text();
    if (res.status === 400 && /stream_options|include_usage|unknown|unrecognized/i.test(t)) { delete body.stream_options; res = await post(); if (!res.ok) throw { status: res.status, body: await res.text(), provider: p }; }
    else throw { status: res.status, body: t, provider: p };
  }
  const r = { inTok: 0, outTok: 0, searches: 0, sources: [], modelUsed: "" };
  let text = "";
  await readSSE(res, ev => {
    if (ev.error) throw { status: ev.error.code || 0, body: JSON.stringify(ev), provider: p };
    if (ev.model) r.modelUsed = ev.model;
    const ch = ev.choices && ev.choices[0];
    if (ch && ch.delta && typeof ch.delta.content === "string" && ch.delta.content) { text += ch.delta.content; cb.text(ch.delta.content); }
    if (ev.usage) { r.inTok = ev.usage.prompt_tokens || r.inTok; r.outTok = ev.usage.completion_tokens || r.outTok; }
  });
  if (!r.inTok && !r.outTok) {
    // keine Verbrauchsangabe: grob schätzen (ca. 4 Zeichen pro Token)
    r.inTok = Math.round((sys.length + msgs.reduce((s, x) => s + x.text.length, 0)) / 4); r.outTok = Math.round(text.length / 4); r.est = true;
  }
  return r;
}

// kurze, nicht gestreamte Anfrage (für die automatische Modellwahl)
async function complete(m, sys, userText, signal) {
  const p = provOf(m);
  if (p.type === "anthropic") {
    const res = await fetch(baseUrl(p) + "/v1/messages", { method: "POST", signal, headers: anthHeaders(p), body: JSON.stringify({ model: m.id, max_tokens: 10, system: sys, messages: [{ role: "user", content: userText }] }) });
    if (!res.ok) throw { status: res.status, body: await res.text(), provider: p };
    const j = await res.json(); const u = j.usage || {};
    return { text: (j.content || []).map(c => c.text || "").join(""), inTok: u.input_tokens || 0, outTok: u.output_tokens || 0 };
  }
  const body = { model: m.id, messages: [{ role: "system", content: sys }, { role: "user", content: userText }] };
  if (p.preset === "openai") body.max_completion_tokens = 400; else body.max_tokens = 400;
  const res = await fetch(baseUrl(p) + "/chat/completions", { method: "POST", signal, headers: oaHeaders(p), body: JSON.stringify(body) });
  if (!res.ok) throw { status: res.status, body: await res.text(), provider: p };
  const j = await res.json(); const u = j.usage || {};
  return { text: (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "", inTok: u.prompt_tokens || 0, outTok: u.completion_tokens || 0 };
}
async function routeRequest(signal) {
  const last = cur.messages[cur.messages.length - 1];
  const empty = { in: 0, out: 0, cost: 0 };
  if ((last.images || []).length) return { cat: "komplex", usage: empty };
  const prev = cur.messages.slice(-3, -1).filter(m => !m.error).map(m => (m.role === "user" ? "Person: " : "Assistent: ") + (m.text || "").slice(0, 300)).join("\n");
  const content = (prev ? "Bisheriger Verlauf (gekürzt):\n" + prev + "\n\n" : "") + "Letzte Nachricht:\n" + (last.text || "").slice(0, 1500);
  const rm = modelByKey(S.router.model);
  const r = await complete(rm, ROUTER_PROMPT, content, signal);
  const t = r.text.toLowerCase();
  const cat = /aktuell/.test(t) ? "aktuell" : /komplex/.test(t) ? "komplex" : /einfach/.test(t) ? "einfach" : "komplex";
  return { cat, usage: { in: r.inTok, out: r.outTok, cost: (r.inTok * rm.inP + r.outTok * rm.outP) / 1e6 } };
}

async function send() {
  const text = input.value.trim(); if (!text && !pending.length) return;
  if (STT.active) STT.stop();
  const viaVoice = STT.used; STT.used = false;
  if (!cur) { cur = { id: uid(), title: (text || "Bild").slice(0, 48), updated: Date.now(), messages: [] }; chats.push(cur); }
  const choice = $("#modelSelect").value;
  cur.messages.push({ role: "user", text, images: pending });
  pending = []; renderPreviews(); input.value = ""; autoGrow();
  cur.updated = Date.now(); await saveChats();
  renderChat();

  const sc = $("#scroller");
  const reply = { role: "assistant", text: "" };
  const el = document.createElement("div"); el.className = "msg assistant";
  el.innerHTML = `<div class="body"><span class="typing"><i></i><i></i><i></i></span></div><div class="status"></div>`;
  sc.append(el); sc.scrollTop = sc.scrollHeight;
  const body = el.querySelector(".body"), st = el.querySelector(".status");

  streaming = new AbortController(); updateSend();
  let raf = 0, r = null, m = null, cat = null, route = { in: 0, out: 0, cost: 0 };
  const paint = () => { raf = 0; const nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 120; renderBody(body, reply.text); if (nearBottom) sc.scrollTop = sc.scrollHeight; };
  const cb = {
    text: d => { reply.text += d; st.textContent = ""; if (!raf) raf = requestAnimationFrame(paint); },
    status: t => { st.textContent = t; },
  };
  try {
    let web = webOn;
    if (choice === "auto") {
      cb.status("Wählt das passende Modell …");
      try { const rr = await routeRequest(streaming.signal); cat = rr.cat; route = rr.usage; }
      catch (e) { if (e && e.name === "AbortError") throw e; cat = "komplex"; console.warn("Automatik fehlgeschlagen:", e); }
      m = resolveRoute(cat);
      if (cat === "aktuell") web = true;
    } else m = modelByKey(choice);
    if (!m || !provOf(m)) throw { msg: "Kein Modell verfügbar. Prüfe die Modelle und Anbieter in den Einstellungen." };
    const p = provOf(m);
    web = web && p.type === "anthropic" && S.webSearch !== false;
    cb.status((cat ? "Automatisch → " : "") + (m.label || m.id) + (web ? " · mit Websuche" : ""));
    const sys = systemPrompt(web), msgs = apiMessages();
    r = p.type === "anthropic" ? await streamAnthropic(m, p, sys, msgs, web, streaming.signal, cb) : await streamOpenAI(m, p, sys, msgs, streaming.signal, cb);
  } catch (e) {
    if (e && e.name === "AbortError") { if (!reply.text) reply.text = "_(abgebrochen)_"; }
    else if (e && ("status" in e || "msg" in e)) reply.error = friendlyError(e);
    else reply.error = "Keine Verbindung zum Anbieter. Prüfe deine Internetverbindung" + (m && provOf(m) && provOf(m).type !== "anthropic" ? " und ob der Anbieter Anfragen direkt aus dem Browser erlaubt" : "") + ". (" + (e && e.message || e) + ")";
  }
  if (raf) cancelAnimationFrame(raf);
  streaming = null; updateSend();
  const inT = (r ? r.inTok : 0) + route.in, outT = (r ? r.outTok : 0) + route.out;
  if (inT || outT) {
    const searchCost = r ? r.searches * (S.searchPrice != null ? +S.searchPrice : 10) / 1000 : 0;
    const cost = (r ? (r.inTok * m.inP + r.outTok * m.outP) / 1e6 : 0) + searchCost + route.cost;
    reply.usage = { in: inT, out: outT, cost, model: m ? (m.label || m.id) : "", route: cat, searches: r ? r.searches : 0, est: !!(r && r.est) };
    if (r && r.modelUsed && m && r.modelUsed !== m.id && !r.modelUsed.startsWith(m.id)) reply.usage.used = r.modelUsed;
    await addUsage(inT, outT, cost);
  }
  if (r && r.sources.length) reply.sources = r.sources.slice(0, 8);
  cur.messages.push(reply); cur.updated = Date.now(); await saveChats();
  const done = msgEl(reply); el.replaceWith(done); sc.scrollTop = sc.scrollHeight;
  if (viaVoice && S.voiceAutoSpeak !== false && !reply.error && reply.text) TTS.speak(reply.text, done.querySelector("[data-speak]"));
}

async function addUsage(i, o, c) {

  u[me.id] = u[me.id] || {}; u[me.id][k] = u[me.id][k] || { in: 0, out: 0, cost: 0, n: 0 };
  const r = u[me.id][k]; r.in += i; r.out += o; r.cost += c; r.n += 1;
  await DB.set("usage", u);

/* ---------- Anbieter bearbeiten ---------- */
function editProvider(p) {
  const isNew = !p;
  const d = p ? Object.assign({}, p) : { id: uid(), preset: "openrouter", type: "openai", name: PRESETS.openrouter.name, baseUrl: PRESETS.openrouter.baseUrl, apiKey: "" };
  const models = S.models.filter(m => m.provider === d.id);
  const sc = openScreen(`<div class="inner">
    <header class="topbar">${BACK}<div class="title">${isNew ? "Anbieter hinzufügen" : esc(d.name)}</div></header>
    <div class="card">
      ${isNew ? `<label class="f" for="vPreset">Anbieter</label><select class="inp" id="vPreset">${["openrouter", "openai", "gemini", "anthropic", "custom"].map(k => `<option value="${k}" ${k === d.preset ? "selected" : ""}>${esc(PRESETS[k].name)}</option>`).join("")}</select>` : ""}
      <label class="f" for="vName">Name</label><input class="inp" id="vName" value="${esc(d.name)}">
      <label class="f" for="vKey">API-Schlüssel</label>
      <div class="row"><input class="inp" id="vKey" type="password" autocomplete="off" value="${esc(d.apiKey)}" placeholder="${esc(PRESETS[d.preset].keyHint)}"><button class="btn ghost" id="vShow" style="margin-left:8px">Zeigen</button></div>
      <p class="hint" id="vWhere" style="margin:6px 0 0"></p>
      <label class="f" for="vUrl">Adresse der Schnittstelle</label><input class="inp" id="vUrl" value="${esc(d.baseUrl)}" placeholder="https://…/v1" inputmode="url">
      <p class="hint" style="margin:6px 0 0">Muss mit https:// beginnen. Bei OpenAI-kompatiblen Anbietern endet sie meist auf /v1.</p>
    </div>
    <div class="card"><h2>Modelle dieses Anbieters</h2>
      ${models.length ? `<div class="plist">${models.map(m => `<div class="pitem" style="cursor:default"><span style="flex:1"><b>${esc(m.label || m.id)}</b><br><span class="meta">${esc(m.id)}${isFree(m) ? " · gratis" : ""}${m.on ? "" : " · aus"}</span></span></div>`).join("")}</div>` : `<p class="hint">Noch keine Modelle. Rufe die Liste ab und wähle aus, oder trage sie in den Einstellungen von Hand ein.</p>`}
      <div class="btnrow"><button class="btn ghost" id="vFetch">Modelle vom Anbieter abrufen</button></div>
    </div>
    <div class="btnrow"><button class="btn" id="vSave">${isNew ? "Anbieter anlegen" : "Speichern"}</button>${!isNew ? `<button class="btn danger" id="vDel">Anbieter löschen</button>` : ""}</div>
  </div>`);
  const q = s => sc.querySelector(s);
  const where = () => { q("#vWhere").textContent = "Schlüssel bekommst du bei " + PRESETS[d.preset].where + "."; };
  where();
  if (isNew) q("#vPreset").onchange = e => {
    const old = PRESETS[d.preset]; d.preset = e.target.value; const pr = PRESETS[d.preset]; d.type = pr.type;
    if (!q("#vName").value.trim() || q("#vName").value === old.name) q("#vName").value = pr.name;
    if (!q("#vUrl").value.trim() || q("#vUrl").value === old.baseUrl) q("#vUrl").value = pr.baseUrl;
    q("#vKey").placeholder = pr.keyHint; where();
  };
  q("#vShow").onclick = e => { const k = q("#vKey"); k.type = k.type === "password" ? "text" : "password"; e.target.textContent = k.type === "password" ? "Zeigen" : "Verbergen"; };
  const read = () => {
    d.name = q("#vName").value.trim(); d.apiKey = q("#vKey").value.trim(); d.baseUrl = q("#vUrl").value.trim().replace(/\/+$/, "");
    if (!d.name) { toast("Bitte gib einen Namen ein"); return false; }
    if (!/^https?:\/\//i.test(d.baseUrl)) { toast("Die Adresse muss mit https:// beginnen"); return false; }
    return true;
  };
  const store = async () => {
    if (!read()) return false;
    const ex = provById(d.id); if (ex) Object.assign(ex, d); else S.providers.push(Object.assign({}, d));
    await saveSettings(); fillModelSelect(); return true;
  };
  q("[data-close]").onclick = showSettings;
  q("#vSave").onclick = async () => { if (await store()) { toast("Gespeichert"); showSettings(); } };
  q("#vFetch").onclick = async () => { if (await store()) pickModels(provById(d.id)); };
  const del = q("#vDel");
  if (del) del.onclick = async () => {
    if (!confirm(`Anbieter „${d.name}“ mit seinen Modellen entfernen?`)) return;
    S.providers = S.providers.filter(x => x.id !== d.id); S.models = S.models.filter(m => m.provider !== d.id);
    await saveSettings(); fillModelSelect(); showSettings();
  };
}

async function fetchModelList(p) {
  let res;
  if (p.type === "anthropic") res = await fetch(baseUrl(p) + "/v1/models?limit=100", { headers: anthHeaders(p) });
  else res = await fetch(baseUrl(p) + "/models", { headers: oaHeaders(p) });
  if (!res.ok) throw { status: res.status, body: await res.text(), provider: p };
  const j = await res.json();
  let list = (j.data || j.models || []).map(x => {
    const id = String(x.id || x.name || "").replace(/^models\//, "");
    const pr = x.pricing || {};
    let inP = pr.prompt != null ? Math.round(+pr.prompt * 1e6 * 1000) / 1000 : null, outP = pr.completion != null ? Math.round(+pr.completion * 1e6 * 1000) / 1000 : null;
    if (p.type === "anthropic") { const g = /haiku/i.test(id) ? [1, 5] : /sonnet/i.test(id) ? [3, 15] : /opus/i.test(id) ? [5, 25] : [null, null]; inP = g[0]; outP = g[1]; }
    return { id, label: (p.type === "anthropic" ? x.display_name : p.preset === "openrouter" ? x.name : x.display_name || x.displayName) || id, inP, outP };
  }).filter(x => x.id);
  if (p.preset === "openai") list = list.filter(x => /^(gpt|o\d|chatgpt)/i.test(x.id) && !/embed|tts|whisper|dall|moderation|audio|realtime|transcribe|image|search|instruct/i.test(x.id));
  if (p.preset === "gemini") list = list.filter(x => /gemini|gemma/i.test(x.id) && !/embed|imagen|veo|tts|aqa|image|live|native-audio/i.test(x.id));
  return list.sort((a, b) => a.label.localeCompare(b.label, "de"));
}
async function pickModels(p) {
  const sc = openScreen(`<div class="inner">
    <header class="topbar">${BACK}<div class="title">Modelle von ${esc(p.name)}</div></header>
    <div class="card" style="position:sticky;top:56px;z-index:1">
      <input class="inp" id="mSearch" type="search" placeholder="Suchen, z. B. llama, mistral, gpt" autocomplete="off">
      ${p.preset === "openrouter" ? `<label class="check" style="margin-bottom:0"><input type="checkbox" id="mFree" checked><span>Nur Gratis-Modelle</span></label>` : ""}
    </div>
    <div id="mList"><p class="hint" style="padding:12px">Lade die Liste …</p></div>
    <div class="btnrow" style="position:sticky;bottom:12px"><button class="btn" id="mAdd" disabled>Hinzufügen</button></div>
  </div>`);
  const q = s => sc.querySelector(s);
  q("[data-close]").onclick = () => editProvider(p);
  let list;
  try { list = await fetchModelList(p); }
  catch (e) { q("#mList").innerHTML = `<div class="err">${esc(e && ("status" in e) ? friendlyError(e) : "Die Liste konnte nicht geladen werden. Prüfe Adresse und Schlüssel, und ob der Anbieter Anfragen aus dem Browser erlaubt. (" + (e && e.message || e) + ")")}</div>`; return; }
  const have = new Set(S.models.filter(m => m.provider === p.id).map(m => m.id));
  const chosen = new Set();
  const priceTxt = x => /:free$/.test(x.id) ? "gratis" : x.inP != null ? `$${x.inP} / $${x.outP} pro Mio. Tokens` : "Preis bitte selbst eintragen";
  const draw = () => {
    const s = q("#mSearch").value.trim().toLowerCase(), free = q("#mFree") && q("#mFree").checked;
    const vis = list.filter(x => (!free || /:free$/.test(x.id)) && (!s || (x.id + " " + x.label).toLowerCase().includes(s)));
    q("#mList").innerHTML = vis.length ? `<div class="card plist">${vis.slice(0, 250).map(x => `<label class="check" style="margin:8px 0"><input type="checkbox" data-id="${esc(x.id)}" ${have.has(x.id) || chosen.has(x.id) ? "checked" : ""} ${have.has(x.id) ? "disabled" : ""}><span><b>${esc(x.label)}</b><br><span class="meta" style="color:var(--ink2);font-size:13px">${esc(x.id)} · ${esc(priceTxt(x))}${have.has(x.id) ? " · bereits vorhanden" : ""}</span></span></label>`).join("")}${vis.length > 250 ? `<p class="hint">… und ${vis.length - 250} weitere. Grenze die Suche ein.</p>` : ""}</div>` : `<p class="hint" style="padding:12px">Nichts gefunden.</p>`;
    q("#mList").querySelectorAll("input[data-id]").forEach(c => c.onchange = () => { c.checked ? chosen.add(c.dataset.id) : chosen.delete(c.dataset.id); upd(); });
  };
  const upd = () => { q("#mAdd").disabled = !chosen.size; q("#mAdd").textContent = chosen.size ? `${chosen.size} hinzufügen` : "Hinzufügen"; };
  q("#mSearch").oninput = draw; if (q("#mFree")) q("#mFree").onchange = draw;
  draw();
  q("#mAdd").onclick = async () => {
    for (const id of chosen) {
      const x = list.find(y => y.id === id);
      S.models.push({ key: uid(), provider: p.id, id, label: x.label.replace(/\s*\(free\)\s*$/i, ""), inP: x.inP || 0, outP: x.outP || 0, on: true });
    }
    await saveSettings(); fillModelSelect(); toast(`${chosen.size} ${chosen.size === 1 ? "Modell" : "Modelle"} hinzugefügt`); editProvider(p);
  };
}

    <div class="card">
      <label class="f" for="pName">Name</label><input class="inp" id="pName" value="${esc(d.name)}" placeholder="z. B. Lena">
      <label class="f">Farbe</label><div class="swatches">${COLORS.map(c => `<button data-c="${c}" style="background:${c}" class="${c === d.color ? "on" : ""}" aria-label="Farbe ${c}"></button>`).join("")}</div>
      <label class="f" for="pPin">PIN (optional)</label><input class="inp" id="pPin" inputmode="numeric" maxlength="6" placeholder="4–6 Ziffern" value="${esc(d.pin)}">
      <label class="check"><input type="checkbox" id="pKid" ${d.kid ? "checked" : ""}><span><b>Kindermodus</b><br><span style="color:var(--ink2);font-size:14px">Altersgerechte, sichere Antworten und Hilfe beim Lernen statt fertiger Lösungen.</span></span></label>
      <label class="check"><input type="checkbox" id="pExt" ${d.external !== false ? "checked" : ""}><span><b>Auch Nicht-Claude-Modelle erlauben</b><br><span style="color:var(--ink2);font-size:14px">Gratis- und Open-Source-Modelle, ChatGPT, Gemini usw. Für Kinder nicht empfohlen, weil deren Schutzmechanismen oft schwächer sind.</span></span></label>
      <label class="f" for="pModel">Modell</label>
      <select class="inp" id="pModel"><option value="">Frei wählbar</option>${modelOptions(d.model).replace(/<option value="([^"]*)"( selected)?>/g, '<option value="$1"$2>Immer ')}</select>
      <label class="f" for="pPrompt">Persönliche Hinweise für die KI (optional)</label>
      <textarea class="inp" id="pPrompt" placeholder="z. B. Ich bin 12 und gehe in die 6. Klasse.">${esc(d.prompt)}</textarea>
    </div>
    <div class="btnrow"><button class="btn" id="pSave">${isNew ? "Profil anlegen" : "Speichern"}</button>${!isNew && P.length > 1 ? `<button class="btn danger" id="pDel">Profil löschen</button>` : ""}</div>
  </div>`);
  sc.querySelectorAll(".swatches button").forEach(b => b.onclick = () => { d.color = b.dataset.c; sc.querySelectorAll(".swatches button").forEach(x => x.classList.toggle("on", x === b)); });
  sc.querySelector("#pKid").onchange = e => { if (e.target.checked) sc.querySelector("#pExt").checked = false; };
  sc.querySelector("[data-close]").onclick = showSettings;
  sc.querySelector("#pSave").onclick = async () => {
    d.name = sc.querySelector("#pName").value.trim(); d.pin = sc.querySelector("#pPin").value.trim();
    d.kid = sc.querySelector("#pKid").checked; d.external = sc.querySelector("#pExt").checked; d.model = sc.querySelector("#pModel").value; d.prompt = sc.querySelector("#pPrompt").value;
    if (!d.name) return toast("Bitte gib einen Namen ein");
    if (d.pin && !/^\d{4,6}$/.test(d.pin)) return toast("Die PIN braucht 4 bis 6 Ziffern");
    if (d.model && !modelAllowed(modelByKey(d.model), d)) return toast("Dieses Modell ist für das Profil nicht erlaubt");
    if (isNew) P.push(d); else Object.assign(P.find(x => x.id === d.id), d);
    await saveProfiles();
    if (me && me.id === d.id) { me = P.find(x => x.id === d.id); applyAccent(me.color); $("#dAvatar").textContent = me.name[0].toUpperCase(); $("#dName").textContent = me.name; fillModelSelect(); }
    showSettings();
  };
  const del = sc.querySelector("#pDel");
  if (del) del.onclick = async () => {
    if (!confirm(`Profil „${d.name}“ mit allen Chats löschen?`)) return;
    P = P.filter(x => x.id !== d.id); await saveProfiles(); await DB.del("chats:" + d.id);
    if (me && me.id === d.id) { showPicker(); return; }
    showSettings();
  };
}

/* ---------- Fehler sichtbar machen ---------- */
window.addEventListener("error", e => toast("Fehler: " + (e.message || "unbekannt")));
window.addEventListener("unhandledrejection", e => toast("Fehler: " + ((e.reason && e.reason.message) || e.reason || "unbekannt")));

/* ---------- Wiring ---------- */
$("#menuBtn").onclick = openDrawer;
$("#scrim").onclick = closeDrawer;
$("#newBtn").onclick = newChat;
$("#newBtn2").onclick = () => { newChat(); closeDrawer(); };
$("#switchBtn").onclick = () => { if (streaming) streaming.abort(); closeDrawer(); showPicker(); };
$("#usageBtn").onclick = showUsage;
$("#settingsBtn").onclick = guardSettings;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
boot();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
